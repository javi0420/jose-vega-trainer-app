<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
    body { background-color: #111; color: white; font-family: sans-serif; padding: 20px; }
    .container { padding: 40px; background-color: #1a1a1a; display: flex; gap: 20px; }
    
    .img-test {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 12px;
    }

    /* Original (Black Square Issue) */
    .original {
        background-color: white;
        filter: grayscale(100%) brightness(0.4) contrast(300%) sepia(100%) hue-rotate(5deg) saturate(400%);
        mix-blend-mode: hard-light;
    }

    /* New Fix: Invert + Screen */
    .new-fix {
        background-color: transparent;
        filter: invert(100%) sepia(100%) saturate(500%) hue-rotate(0deg) brightness(1.2) contrast(1.2);
        mix-blend-mode: screen;
    }

    .new-fix-gold {
        background-color: transparent;
        /* Custom gold tuning for the inverted image */
        filter: invert(100%) sepia(100%) saturate(1000%) hue-rotate(5deg) brightness(0.9) contrast(1.5);
        mix-blend-mode: screen;
    }
</style>
</head>
<body>
    <h2>CSS Filter Test</h2>
    <div class="container">
        <div>
            <p>1. Raw JPG</p>
            <img src="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Alternate_Heel_Touchers/0.jpg" class="img-test">
        </div>
        <div>
            <p>2. Old Filter (Black Box)</p>
            <img src="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Alternate_Heel_Touchers/0.jpg" class="img-test original">
        </div>
        <div>
            <p>3. New Filter (Golden Silhouette)</p>
            <img src="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/Alternate_Heel_Touchers/0.jpg" class="img-test new-fix-gold">
        </div>
    </div>
</body>
</html>
